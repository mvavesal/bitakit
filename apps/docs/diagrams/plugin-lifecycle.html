<!DOCTYPE html>
<!-- Source of a BitaKit documentation diagram, drawn with the diagram-design skill (profile:
     bitakit, system fonts). Edit this file, then run `npm run diagrams` to derive the dark
     variant and export both SVGs. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add, disable, enable and remove a plugin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · BitaKit</p>
    <h1>Add, disable, enable and remove a plugin</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-lifecycle-title plugin-lifecycle-desc">
        <title id="plugin-lifecycle-title">Add, disable, enable and remove a plugin</title>
        <desc id="plugin-lifecycle-desc">State machine: adding a plugin definition starts it; a running plugin can be disabled, which keeps its definition, setting values and contracts, and enabled again with fresh instances; removing it from either state releases its declarations while saved setting records stay.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
        <rect width="100%" height="100%" fill="#f6f8fa"/>
        <path d="M 54,96 L 128,96" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 328,84 L 472,84" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472,112 L 328,112" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 212,128 L 212,216 Q 212,224 220,224 L 300,224" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 588,128 L 588,216 Q 588,224 580,224 L 500,224" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 400,256 L 400,280" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="79.5" y="76" width="25" height="12" rx="2" fill="#f6f8fa"/>
        <text x="92" y="85" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ADD</text>
        <rect x="377.5" y="64" width="45" height="12" rx="2" fill="#f6f8fa"/>
        <text x="400" y="73" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">DISABLE</text>
        <rect x="380.0" y="120" width="40" height="12" rx="2" fill="#f6f8fa"/>
        <text x="400" y="129" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ENABLE</text>
        <rect x="228.0" y="204" width="40" height="12" rx="2" fill="#f6f8fa"/>
        <text x="248" y="213" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">REMOVE</text>
        <rect x="532.0" y="204" width="40" height="12" rx="2" fill="#f6f8fa"/>
        <text x="552" y="213" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">REMOVE</text>
        <circle cx="48" cy="96" r="6" fill="#122f4d"/>
        <rect x="128" y="64" width="200" height="64" rx="8" fill="#f6f8fa"/>
        <rect x="128" y="64" width="200" height="64" rx="8" fill="rgba(235,183,89,0.16)" stroke="#9a6700" stroke-width="1"/>
        <text x="228.0" y="93.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Running</text>
        <text x="228.0" y="107.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">services, Actions, UI</text>
        <rect x="472" y="64" width="200" height="64" rx="8" fill="#f6f8fa"/>
        <rect x="472" y="64" width="200" height="64" rx="8" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="572.0" y="93.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Disabled</text>
        <text x="572.0" y="107.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">definition + settings kept</text>
        <rect x="300" y="192" width="200" height="64" rx="8" fill="#f6f8fa"/>
        <rect x="300" y="192" width="200" height="64" rx="8" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="400.0" y="215.0" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Removed</text>
        <text x="400.0" y="229.0" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">declarations released</text>
        <text x="400.0" y="242.0" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">saved settings stay</text>
        <circle cx="400" cy="288" r="8" fill="#f6f8fa" stroke="#122f4d" stroke-width="1"/>
        <circle cx="400" cy="288" r="5" fill="#122f4d"/>
      </svg>
    </div>
  </div>
</body>
</html>
