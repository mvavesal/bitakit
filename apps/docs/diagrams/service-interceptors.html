<!DOCTYPE html>
<!-- Source of a BitaKit documentation diagram, drawn with the diagram-design skill (profile:
     bitakit, system fonts). Edit this file, then run `npm run diagrams` to derive the dark
     variant and export both SVGs. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observe a service call</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · BitaKit</p>
    <h1>Observe a service call</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="service-interceptors-title service-interceptors-desc">
        <title id="service-interceptors-title">Observe a service call</title>
        <desc id="service-interceptors-desc">Data flow: a call through the service container runs before hooks with the arguments, then the original method; after hooks observe the result and onError observes a failure. Hooks cannot block or change the call.</desc>
        <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
        <rect width="100%" height="100%" fill="#f6f8fa"/>
        <path d="M 184,104 L 232,104" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 376,104 L 424,104" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 560,96 L 576,96 Q 584,96 584,88 L 584,72 Q 584,64 592,64 L 648,64" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 560,112 L 592,112 Q 600,112 600,120 L 600,136 Q 600,144 608,144 L 648,144" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="591.0" y="44" width="50" height="12" rx="2" fill="#f6f8fa"/>
        <text x="616" y="53" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">RESOLVES</text>
        <rect x="604.0" y="152" width="40" height="12" rx="2" fill="#f6f8fa"/>
        <text x="624" y="161" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">THROWS</text>
        <rect x="40" y="80" width="144" height="48" rx="6" fill="#f6f8fa"/>
        <rect x="40" y="80" width="144" height="48" rx="6" fill="rgba(75,98,121,0.1)" stroke="#59636e" stroke-width="1"/>
        <text x="112.0" y="101.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">A caller</text>
        <text x="112.0" y="115.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Action, page, service</text>
        <rect x="232" y="80" width="144" height="48" rx="6" fill="#f6f8fa"/>
        <rect x="232" y="80" width="144" height="48" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="304.0" y="101.5" fill="#122f4d" font-size="12" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">before</text>
        <text x="304.0" y="115.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">sees the arguments</text>
        <rect x="424" y="80" width="136" height="48" rx="6" fill="#f6f8fa"/>
        <rect x="424" y="80" width="136" height="48" rx="6" fill="rgba(235,183,89,0.16)" stroke="#9a6700" stroke-width="1"/>
        <text x="492.0" y="101.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">The method</text>
        <text x="492.0" y="115.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">runs unchanged</text>
        <rect x="648" y="40" width="120" height="48" rx="6" fill="#f6f8fa"/>
        <rect x="648" y="40" width="120" height="48" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="708.0" y="61.5" fill="#122f4d" font-size="12" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">after</text>
        <text x="708.0" y="75.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">sees the result</text>
        <rect x="648" y="120" width="120" height="48" rx="6" fill="#f6f8fa"/>
        <rect x="648" y="120" width="120" height="48" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="708.0" y="141.5" fill="#122f4d" font-size="12" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">onError</text>
        <text x="708.0" y="155.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">sees the failure</text>
      </svg>
    </div>
  </div>
</body>
</html>
