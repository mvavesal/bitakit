<!DOCTYPE html>
<!-- Source of a BitaKit documentation diagram, drawn with the diagram-design skill (profile:
     bitakit, system fonts). Edit this file, then run `npm run diagrams` to derive the dark
     variant and export both SVGs. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One declaration, one value owner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 816px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data flow · BitaKit</p>
    <h1>One declaration, one value owner</h1>
    <div class="diagram-container">

        <title id="settings-flow-title">One declaration, one value owner</title>
        <desc id="settings-flow-desc">Data flow: settings.ts feeds the settings catalog, which adds a navigation entry and a generated page; the page reads and writes the Core settings store, the only owner of values, which saves through the settings.storage contract.</desc>

        <rect width="100%" height="100%" fill="#f6f8fa"/>
        <path d="M 200,76 L 232,76" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 392,76 L 424,76" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 392,196 L 424,196" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 584,196 L 616,196" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="40" y="48" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="40" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="120.0" y="73.5" fill="#122f4d" font-size="12" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">settings.ts</text>
        <text x="120.0" y="87.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">defineSettings(...)</text>
        <rect x="232" y="48" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="232" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="312.0" y="73.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Settings catalog</text>
        <text x="312.0" y="87.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">keys, labels, controls</text>
        <rect x="424" y="48" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="424" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="504.0" y="73.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Navigation entry</text>
        <text x="504.0" y="87.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Settings → Greeting</text>
        <rect x="232" y="168" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="232" y="168" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="312.0" y="193.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Generated page</text>
        <text x="312.0" y="207.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">fields, save, reset</text>
        <rect x="424" y="168" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="424" y="168" width="160" height="56" rx="6" fill="rgba(235,183,89,0.16)" stroke="#9a6700" stroke-width="1"/>
        <text x="504.0" y="193.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Core settings store</text>
        <text x="504.0" y="207.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">the value owner</text>
        <rect x="616" y="168" width="160" height="56" rx="6" fill="#f6f8fa"/>

        <text x="696.0" y="207.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">browser or server</text>
      </svg>
    </div>
  </div>
</body>
</html>
