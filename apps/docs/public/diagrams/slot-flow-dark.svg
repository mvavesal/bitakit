<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 272" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slot-flow-dark-title slot-flow-dark-desc" id="slot-flow-dark-root">
        <title id="slot-flow-dark-title">A slot: declared, filled, rendered</title>
        <desc id="slot-flow-dark-desc">Architecture: the owner declares a slot such as notes.toolbar and renders it with useSlot or PluginSlot; other plugins fill it with an Action listing the slot or a ui/slots component; Core validates and attaches the contributions.</desc>
        <defs>
      <style>#slot-flow-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #slot-flow-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #slot-flow-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#slot-flow-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="slot-flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="slot-flow-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="slot-flow-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
