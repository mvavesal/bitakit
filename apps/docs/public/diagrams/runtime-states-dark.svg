<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 848 312" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="runtime-states-dark-title runtime-states-dark-desc" id="runtime-states-dark-root">
        <title id="runtime-states-dark-title">From startup to shutdown</title>
        <desc id="runtime-states-dark-desc">State machine: a runtime is idle until mounted, then starting; it becomes ready or failed; a stop request from starting or ready, or a teardown after failure, moves it to stopping, which ends stopped, or failed when cleanup fails.</desc>
        <defs>
      <style>#runtime-states-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #runtime-states-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #runtime-states-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#runtime-states-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="runtime-states-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="runtime-states-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="runtime-states-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
