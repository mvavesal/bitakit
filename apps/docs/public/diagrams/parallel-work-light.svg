<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallel-work-title parallel-work-desc" id="parallel-work-root">
        <title id="parallel-work-title">Three people, one app</title>
        <desc id="parallel-work-desc">Comparison: without a shared structure, you, agent A and agent B each edit shared files such as routes.ts, menu.tsx and settings.tsx, so two of them are edited by all three; with BitaKit each owns one plugin folder, notes, activity and export, and the plugins meet only through contracts.</desc>
