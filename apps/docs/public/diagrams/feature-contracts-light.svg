<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 940 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="feature-contracts-title feature-contracts-desc" id="feature-contracts-root">
        <title id="feature-contracts-title">Features meet at their contracts</title>
        <desc id="feature-contracts-desc">Architecture: an auth adapter provides the auth contract the notes plugin uses; notes emits notes.changed, which notifies the activity plugin; the tips plugin fills the notes.footer slot that notes renders. Each plugin owns its implementation.</desc>
        <defs>
