<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 816 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="settings-flow-dark-title settings-flow-dark-desc" id="settings-flow-dark-root">
        <title id="settings-flow-dark-title">One declaration, one value owner</title>
        <desc id="settings-flow-dark-desc">Data flow: settings.ts feeds the settings catalog, which adds a navigation entry and a generated page; the page reads and writes the Core settings store, the only owner of values, which saves through the settings.storage contract.</desc>
        <defs>
      <style>#settings-flow-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #settings-flow-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #settings-flow-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#settings-flow-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="settings-flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="settings-flow-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="settings-flow-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
