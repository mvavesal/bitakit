<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 816 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trusted-package-flow-dark-title trusted-package-flow-dark-desc" id="trusted-package-flow-dark-root">
        <title id="trusted-package-flow-dark-title">A trusted catalog becomes an active feature</title>
        <desc id="trusted-package-flow-dark-desc">Data flow: an operator selects reviewed code for the build; its catalog lists names, versions and loaders; with an authorized selection from the host, the package host loads the matching entries and Core starts and owns the plugins, whose Actions, services, pages and Settings appear.</desc>
        <defs>
      <style>#trusted-package-flow-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #trusted-package-flow-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #trusted-package-flow-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#trusted-package-flow-dark-root .diagram-container { overflow-x: visible; }
