<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 896 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="theme-flow-title theme-flow-desc" id="theme-flow-root">
        <title id="theme-flow-title">From a theme file to the app</title>
        <desc id="theme-flow-desc">Data flow: discovery adds src/themes/ocean.json to the app theme catalog at build time; the user chooses a theme, saved as a Core setting; the Shell theme service applies its tokens for the chosen light, dark or system mode to the html element, and every control inherits them.</desc>
        <defs>
      <style>#theme-flow-root { --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #theme-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #theme-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#theme-flow-root .diagram-container { overflow-x: visible; }
}</style><marker id="theme-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="theme-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="theme-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
