        <title id="todo-comparison-title">The same Todo app, two ways</title>
        <desc id="todo-comparison-desc">Tokens of code an agent writes per capability for a Todo app with settings, themes and layouts. Hand-written with standard libraries, estimated: 14,200 tokens. With BitaKit, measured from the sample apps: 2,245 tokens. Infrastructure tests: 3,500 versus 0; App settings: 2,200 versus 254; Frame and navigation: 2,000 versus 54; Todo feature: 1,800 versus 683; Theming: 1,500 versus 400; Actions and UI state: 1,200 versus 328; Search: 1,100 versus 0; Layouts and screens: 900 versus 526.</desc>
