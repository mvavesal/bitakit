      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #todo-comparison-root { font-family: var(--font-sans); color: var(--color-ink); }
      #todo-comparison-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#todo-comparison-root .diagram-container { overflow-x: visible; }
