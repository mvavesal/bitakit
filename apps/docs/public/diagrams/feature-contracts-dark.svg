        <title id="feature-contracts-dark-title">Features meet at their contracts</title>
        <desc id="feature-contracts-dark-desc">Architecture: an auth adapter provides the auth contract the notes plugin uses; notes emits notes.changed, which notifies the activity plugin; the tips plugin fills the notes.footer slot that notes renders. Each plugin owns its implementation.</desc>
