<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="discovery-boundary-title discovery-boundary-desc" id="discovery-boundary-root">
        <title id="discovery-boundary-title">From files to a running plugin</title>
        <desc id="discovery-boundary-desc">Process: at build time, discovery parses the plugin files in Node and generates imports and types; in the browser the generated provider mounts and Core starts the plugins. Browsers never scan directories.</desc>
        <defs>
      <style>#discovery-boundary-root { --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #discovery-boundary-root { font-family: var(--font-sans); color: var(--color-ink); }
      #discovery-boundary-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#discovery-boundary-root .diagram-container { overflow-x: visible; }
}</style><marker id="discovery-boundary-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="discovery-boundary-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="discovery-boundary-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
        <rect width="100%" height="100%" fill="#f6f8fa"/>
        <rect x="24" y="48" width="552" height="120" rx="8" fill="#122f4d" stroke="#122f4d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="36" y="42" width="86" height="12" rx="2" fill="#f6f8fa"/>
        <text x="79.0" y="51" fill="#59636e" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">BUILD TIME · NODE</text>
        <rect x="600" y="48" width="336" height="120" rx="8" fill="#122f4d" stroke="#122f4d" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="612" y="42" width="73" height="12" rx="2" fill="#f6f8fa"/>
        <text x="648.5" y="51" fill="#59636e" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">IN THE BROWSER</text>
        <path d="M 192,108 L 224,108" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#discovery-boundary-arrow)"/>
        <path d="M 376,108 L 408,108" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#discovery-boundary-arrow)"/>
        <path d="M 560,108 L 616,108" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#discovery-boundary-arrow)"/>
        <path d="M 768,108 L 784,108" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#discovery-boundary-arrow)"/>
        <rect x="40" y="80" width="152" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="40" y="80" width="152" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="116.0" y="105.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Plugin files</text>
        <text x="116.0" y="119.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">src/plugins/**</text>
        <rect x="224" y="80" width="152" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="224" y="80" width="152" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="300.0" y="105.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Parse definitions</text>
        <text x="300.0" y="119.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">describeModule</text>
        <rect x="408" y="80" width="152" height="56" rx="6" fill="#f6f8fa"/>
