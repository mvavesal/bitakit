        <rect x="616" y="80" width="152" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="616" y="80" width="152" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="692.0" y="105.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Mount provider</text>
        <text x="692.0" y="119.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">BitaKitProvider</text>
        <rect x="784" y="80" width="136" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="784" y="80" width="136" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="852.0" y="105.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Core starts</text>
        <text x="852.0" y="119.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">services, Actions, UI</text>
      </svg>
