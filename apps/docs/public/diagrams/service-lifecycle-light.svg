<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 816 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="service-lifecycle-title service-lifecycle-desc" id="service-lifecycle-root">
        <title id="service-lifecycle-title">A service owns its startup and cleanup</title>
        <desc id="service-lifecycle-desc">Process: Core resolves the services a service requires, creates it with an owned scope, awaits onStart and publishes readiness; on stop it gates new work, aborts and drains, then cleans up dependents before the services they use.</desc>
        <defs>
      <style>#service-lifecycle-root { --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #service-lifecycle-root { font-family: var(--font-sans); color: var(--color-ink); }
      #service-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#service-lifecycle-root .diagram-container { overflow-x: visible; }
}</style><marker id="service-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="service-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="service-lifecycle-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
        <rect width="100%" height="100%" fill="#f6f8fa"/>
        <path d="M 200,76 L 232,76" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#service-lifecycle-arrow)"/>
        <path d="M 392,76 L 424,76" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#service-lifecycle-arrow)"/>
        <path d="M 584,76 L 616,76" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#service-lifecycle-arrow)"/>
        <path d="M 696,104 L 696,168" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#service-lifecycle-arrow)"/>
        <path d="M 616,196 L 584,196" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#service-lifecycle-arrow)"/>
        <path d="M 424,196 L 384,196" fill="none" stroke="#4b6279" stroke-width="1.2" marker-end="url(#service-lifecycle-arrow)"/>
        <rect x="713.0" y="130" width="30" height="12" rx="2" fill="#f6f8fa"/>
        <text x="728" y="139" fill="#59636e" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">STOP</text>
        <rect x="40" y="48" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="40" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="120.0" y="73.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Resolve requires</text>
        <text x="120.0" y="87.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">other services first</text>
        <rect x="232" y="48" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="232" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="312.0" y="73.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Create</text>
        <text x="312.0" y="87.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">owned scope</text>
        <rect x="424" y="48" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="424" y="48" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="504.0" y="73.5" fill="#122f4d" font-size="12" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">onStart</text>
        <text x="504.0" y="87.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">load, subscribe</text>
        <rect x="616" y="48" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="616" y="48" width="160" height="56" rx="6" fill="#ebb759" stroke="#9a6700" stroke-width="1" fill-opacity="0.16"/>
        <text x="696.0" y="73.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Ready</text>
        <text x="696.0" y="87.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">readiness published</text>
        <rect x="616" y="168" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="616" y="168" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="696.0" y="193.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Stop</text>
        <text x="696.0" y="207.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">gate, abort, drain</text>
        <rect x="424" y="168" width="160" height="56" rx="6" fill="#f6f8fa"/>
        <rect x="424" y="168" width="160" height="56" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="504.0" y="193.5" fill="#122f4d" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Cleanup</text>
        <text x="504.0" y="207.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">dependents first</text>
        <circle cx="376" cy="196" r="8" fill="#f6f8fa" stroke="#122f4d" stroke-width="1"/>
        <circle cx="376" cy="196" r="5" fill="#122f4d"/>
      </svg>
