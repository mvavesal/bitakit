        <path d="M 472,112 L 328,112" fill="none" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#plugin-lifecycle-dark-arrow)"/>
        <path d="M 212,128 L 212,216 Q 212,224 220,224 L 300,224" fill="none" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#plugin-lifecycle-dark-arrow)"/>
        <path d="M 588,128 L 588,216 Q 588,224 580,224 L 500,224" fill="none" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#plugin-lifecycle-dark-arrow)"/>
