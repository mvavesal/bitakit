<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 316" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-lifecycle-dark-title plugin-lifecycle-dark-desc" id="plugin-lifecycle-dark-root">
        <title id="plugin-lifecycle-dark-title">Add, disable, enable and remove a plugin</title>
        <desc id="plugin-lifecycle-dark-desc">State machine: adding a plugin definition starts it; a running plugin can be disabled, which keeps its definition, setting values and contracts, and enabled again with fresh instances; removing it from either state releases its declarations while saved setting records stay.</desc>
        <defs>
      <style>#plugin-lifecycle-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #plugin-lifecycle-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #plugin-lifecycle-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#plugin-lifecycle-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="plugin-lifecycle-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="plugin-lifecycle-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="plugin-lifecycle-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
