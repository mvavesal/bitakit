        <text x="400.0" y="229.0" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">declarations released</text>
        <text x="400.0" y="242.0" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">saved settings stay</text>
        <circle cx="400" cy="288" r="8" fill="#0d1117" stroke="#e6edf3" stroke-width="1"/>
