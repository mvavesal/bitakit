<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="event-delivery-dark-title event-delivery-dark-desc" id="event-delivery-dark-root">
        <title id="event-delivery-dark-title">Notify other plugins</title>
        <desc id="event-delivery-dark-desc">Data flow: the owning plugin emits notes.changed after its state changes; the runtime delivers it to every listener, a service listening with events.on and a component using useEvent while it is mounted.</desc>
        <defs>
      <style>#event-delivery-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #event-delivery-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #event-delivery-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#event-delivery-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="event-delivery-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="event-delivery-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="event-delivery-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
        <rect width="100%" height="100%" fill="#0d1117"/>
        <path d="M 200,112 L 280,112" fill="none" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#event-delivery-dark-arrow)"/>
        <path d="M 440,104 L 472,104 Q 480,104 480,96 L 480,76 Q 480,68 488,68 L 520,68" fill="none" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#event-delivery-dark-arrow)"/>
        <path d="M 440,124 L 488,124 Q 496,124 496,132 L 496,156 Q 496,164 504,164 L 520,164" fill="none" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#event-delivery-dark-arrow)"/>
        <rect x="225.0" y="92" width="30" height="12" rx="2" fill="#0d1117"/>
        <text x="240" y="101" fill="#9198a1" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">EMIT</text>
        <rect x="40" y="84" width="160" height="56" rx="6" fill="#0d1117"/>
        <rect x="40" y="84" width="160" height="56" rx="6" fill="#151b23" stroke="#e6edf3" stroke-width="1"/>
        <rect x="48" y="90" width="32" height="12" rx="2" fill="none" stroke="#9198a1" stroke-width="0.8"/>
        <text x="64.0" y="99" fill="#9198a1" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">OWNER</text>
        <text x="120.0" y="118.5" fill="#e6edf3" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">notes</text>
        <text x="120.0" y="132.5" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">emits notes.changed</text>
        <rect x="280" y="84" width="160" height="56" rx="6" fill="#0d1117"/>
        <rect x="280" y="84" width="160" height="56" rx="6" fill="#ebb759" stroke="#ebb759" stroke-width="1" fill-opacity="0.12"/>
        <rect x="288" y="90" width="27" height="12" rx="2" fill="none" stroke="#ebb759" stroke-width="0.8"/>
        <text x="301.5" y="99" fill="#ebb759" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="360.0" y="118.5" fill="#e6edf3" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">Runtime events</text>
        <text x="360.0" y="132.5" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">one typed bus</text>
        <rect x="520" y="40" width="200" height="56" rx="6" fill="#0d1117"/>
