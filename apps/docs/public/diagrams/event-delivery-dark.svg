        <text x="620.0" y="74.5" fill="#e6edf3" font-size="12" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">activity.feed</text>
        <text x="620.0" y="88.5" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">events.on(&#x27;notes.changed&#x27;)</text>
        <rect x="520" y="136" width="200" height="56" rx="6" fill="#0d1117"/>
        <rect x="520" y="136" width="200" height="56" rx="6" fill="#151b23" stroke="#e6edf3" stroke-width="1"/>
        <rect x="528" y="142" width="32" height="12" rx="2" fill="none" stroke="#9198a1" stroke-width="0.8"/>
        <text x="544.0" y="151" fill="#9198a1" font-size="7" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">REACT</text>
        <text x="620.0" y="170.5" fill="#e6edf3" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">A component</text>
        <text x="620.0" y="184.5" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">useEvent(&#x27;notes.changed&#x27;)</text>
      </svg>
