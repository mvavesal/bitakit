        <polygon points="320,312 420,360 320,408 220,360" fill="#f6f8fa"/>
        <polygon points="320,312 420,360 320,408 220,360" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
        <text x="320" y="357" fill="#122f4d" font-size="11.5" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">A personal</text>
        <text x="320" y="371" fill="#122f4d" font-size="11.5" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" text-anchor="middle">theme?</text>
        <rect x="24" y="336" width="160" height="48" rx="6" fill="#f6f8fa"/>
