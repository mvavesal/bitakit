<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="theme-editing-title theme-editing-desc" id="theme-editing-root">
        <title id="theme-editing-title">Preview first, save when ready</title>
        <desc id="theme-editing-desc">Flowchart: customizing a theme opens a local draft previewed in light and dark; cancelling discards it and leaves the app unchanged; saving an original creates and selects a personal copy, saving a personal theme updates it, and Core confirms before Shell applies it.</desc>
        <defs>
      <style>#theme-editing-root { --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #theme-editing-root { font-family: var(--font-sans); color: var(--color-ink); }
      #theme-editing-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#theme-editing-root .diagram-container { overflow-x: visible; }
}</style><marker id="theme-editing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="theme-editing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="theme-editing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
