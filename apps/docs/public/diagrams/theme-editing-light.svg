        <text x="104.0" y="371.5" fill="#4b6279" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">and select it</text>
        <rect x="456" y="336" width="160" height="48" rx="6" fill="#f6f8fa"/>
        <rect x="456" y="336" width="160" height="48" rx="6" fill="#ffffff" stroke="#122f4d" stroke-width="1"/>
