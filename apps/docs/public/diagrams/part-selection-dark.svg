        <title id="part-selection-dark-title">Which candidate renders a part?</title>
        <desc id="part-selection-dark-desc">Flowchart: a replaceable part renders the candidate chosen in bitakit.config.ts, otherwise the app&#x27;s own file, otherwise its only candidate; with none the owner&#x27;s default renders, and with several undecided ones the default renders and doctor asks for a choice.</desc>
