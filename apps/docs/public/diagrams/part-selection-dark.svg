      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #part-selection-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #part-selection-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#part-selection-dark-root .diagram-container { overflow-x: visible; }
