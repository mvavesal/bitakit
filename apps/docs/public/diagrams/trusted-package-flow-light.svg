<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 816 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trusted-package-flow-title trusted-package-flow-desc" id="trusted-package-flow-root">
        <title id="trusted-package-flow-title">A trusted catalog becomes an active feature</title>
        <desc id="trusted-package-flow-desc">Data flow: an operator selects reviewed code for the build; its catalog lists names, versions and loaders; with an authorized selection from the host, the package host loads the matching entries and Core starts and owns the plugins, whose Actions, services, pages and Settings appear.</desc>
        <defs>
      <style>#trusted-package-flow-root { --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #trusted-package-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #trusted-package-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#trusted-package-flow-root .diagram-container { overflow-x: visible; }
}</style><marker id="trusted-package-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="trusted-package-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="trusted-package-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
