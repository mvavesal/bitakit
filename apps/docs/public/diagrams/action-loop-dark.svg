        <rect x="748" y="64" width="140" height="112" rx="6" fill="#0d1117"/>
        <rect x="748" y="64" width="140" height="112" rx="6" fill="#e6edf3" stroke="#9bb1c8" stroke-width="1" fill-opacity="0.05"/>
        <rect x="756" y="70" width="32" height="12" rx="2" fill="none" stroke="#9198a1" stroke-width="0.8"/>
