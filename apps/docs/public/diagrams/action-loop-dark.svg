        <path d="M 652,100 L 748,100" fill="none" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#action-loop-dark-arrow)"/>
        <path d="M 818,176 L 818,216 Q 818,224 810,224 L 376,224 Q 368,224 368,216 L 368,176" fill="none" stroke="#ebb759" stroke-width="1.4" marker-end="url(#action-loop-dark-arrow-accent)"/>
        <path d="M 276,148 L 180,148" fill="none" stroke="#ebb759" stroke-width="1.4" marker-end="url(#action-loop-dark-arrow-accent)"/>
        <rect x="195.5" y="80" width="65" height="12" rx="2" fill="#0d1117"/>
