        <text x="346.0" y="120.0" fill="#e6edf3" font-size="12" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">todos.delete</text>
        <text x="346.0" y="134.0" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">enabled · title</text>
        <text x="346.0" y="147.0" fill="#9bb1c8" font-size="9" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">confirm · execute</text>
        <rect x="512" y="64" width="140" height="112" rx="6" fill="#0d1117"/>
        <rect x="512" y="64" width="140" height="112" rx="6" fill="#151b23" stroke="#e6edf3" stroke-width="1"/>
