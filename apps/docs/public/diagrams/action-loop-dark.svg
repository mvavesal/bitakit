        <text x="32" y="278" fill="#9bb1c8" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.18em">LEGEND</text>
        <line x1="104" y1="275" x2="128" y2="275" stroke="#ebb759" stroke-width="1.2" marker-end="url(#action-loop-dark-arrow-accent)"/>
        <text x="136" y="278" fill="#9bb1c8" font-size="9" font-family="'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif">state flows back to every control</text>
        <line x1="342" y1="275" x2="366" y2="275" stroke="#9bb1c8" stroke-width="1.2" marker-end="url(#action-loop-dark-arrow)"/>
