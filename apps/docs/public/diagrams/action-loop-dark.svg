<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 928 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="action-loop-dark-title action-loop-dark-desc" id="action-loop-dark-root">
        <title id="action-loop-dark-title">One Action, every control</title>
        <desc id="action-loop-dark-desc">Action loop: a bound button, menu item or shortcut executes todos.delete; the Action calls the tasks service, which updates its store; the store change recomputes enabled and every bound control receives the new state.</desc>
        <defs>
      <style>#action-loop-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #action-loop-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #action-loop-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#action-loop-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="action-loop-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="action-loop-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="action-loop-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
