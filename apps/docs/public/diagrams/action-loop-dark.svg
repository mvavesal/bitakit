        <rect x="429.0" y="80" width="70" height="12" rx="2" fill="#0d1117"/>
        <text x="464.0" y="89" fill="#9198a1" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">2 · REMOVE()</text>
        <rect x="663.0" y="80" width="74" height="12" rx="2" fill="#0d1117"/>
        <text x="700.0" y="89" fill="#9198a1" font-size="8" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">3 · SET STATE</text>
