      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #service-state-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #service-state-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#service-state-dark-root .diagram-container { overflow-x: visible; }
