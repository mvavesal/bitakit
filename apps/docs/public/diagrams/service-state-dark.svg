<svg viewBox="0 0 760 224" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="service-state-dark-title service-state-dark-desc" id="service-state-dark-root">
        <title id="service-state-dark-title">One store, several readers</title>
        <desc id="service-state-dark-desc">Data flow: an Action calls the counter.value service, which updates its store; the page that shows the count and the Action presentation both re-read the same store.</desc>
