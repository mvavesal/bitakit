<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="feature-growth-title feature-growth-desc" id="feature-growth-root">
        <title id="feature-growth-title">The next feature, as the app grows</title>
        <desc id="feature-growth-desc">Estimated agent tokens to add one more feature, by how many features the app already has. Hand-written, the next feature costs more each time: 282K tokens for the first, 895K for the 50th, because shared menu, route, search and settings files grow. With BitaKit it stays at about 137K, since each feature is its own folder.</desc>
        <defs>
      <style>#feature-growth-root { --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #feature-growth-root { font-family: var(--font-sans); color: var(--color-ink); }
      #feature-growth-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#feature-growth-root .diagram-container { overflow-x: visible; }
}</style><marker id="feature-growth-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4b6279"/></marker><marker id="feature-growth-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a6700"/></marker><marker id="feature-growth-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f5fa8"/></marker></defs>
