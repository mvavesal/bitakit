<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plugin-extension-title plugin-extension-desc" id="plugin-extension-root">
        <title id="plugin-extension-title">How plugins extend a page</title>
        <desc id="plugin-extension-desc">Wireframe of the Workspace notes page: the notes plugin owns the page; the activity plugin fills the header widget and the notes.footer slot, the export plugin fills the notes.toolbar slot and the guard plugin checks the Add note Action, each from its own folder.</desc>
