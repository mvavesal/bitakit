<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 896 248" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="theme-flow-dark-title theme-flow-dark-desc" id="theme-flow-dark-root">
        <title id="theme-flow-dark-title">From a theme file to the app</title>
        <desc id="theme-flow-dark-desc">Data flow: discovery adds src/themes/ocean.json to the app theme catalog at build time; the user chooses a theme, saved as a Core setting; the Shell theme service applies its tokens for the chosen light, dark or system mode to the html element, and every control inherits them.</desc>
        <defs>
      <style>#theme-flow-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #theme-flow-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #theme-flow-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#theme-flow-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="theme-flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="theme-flow-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="theme-flow-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
