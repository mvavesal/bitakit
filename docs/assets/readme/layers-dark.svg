      <style>#layers-dark-root { --color-paper: #0d1117;
      --color-ink: #e6edf3;
      --color-muted: #9bb1c8;
      --color-accent: #ebb759;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #layers-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #layers-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#layers-dark-root .diagram-container { overflow-x: visible; }
}</style><marker id="layers-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9bb1c8"/></marker><marker id="layers-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ebb759"/></marker><marker id="layers-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#79a8e0"/></marker></defs>
