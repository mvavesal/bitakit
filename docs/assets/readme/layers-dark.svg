<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-dark-title layers-dark-desc" id="layers-dark-root">
        <title id="layers-dark-title">BitaKit is a composition layer</title>
        <desc id="layers-dark-desc">Layer stack: your pages and components sit on feature plugins, one folder each; the plugins snap onto BitaKit Core, which provides Actions, services, events, settings, slots, layouts and interceptors as contracts; discovery and the adapter connect it at build time; Next.js or TanStack Start keeps routing, rendering and deployment.</desc>
