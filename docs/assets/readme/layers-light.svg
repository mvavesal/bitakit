      <style>#layers-root { --color-paper: #f6f8fa;
      --color-ink: #122f4d;
      --color-muted: #4b6279;
      --color-accent: #9a6700;
      --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      #layers-root { font-family: var(--font-sans); color: var(--color-ink); }
      #layers-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#layers-root .diagram-container { overflow-x: visible; }
