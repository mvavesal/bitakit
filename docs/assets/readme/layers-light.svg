<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc" id="layers-root">
        <title id="layers-title">BitaKit is a composition layer</title>
        <desc id="layers-desc">A thin app layer composes your custom feature plugins and optional packages including Shell, App Preferences, Quick Search, Scheduler and Better Auth; the plugins snap onto BitaKit Core, which provides Actions, services, events, settings, slots, layouts and interceptors as contracts; discovery and the adapter connect it at build time; Next.js or TanStack Start keeps routing, rendering and deployment.</desc>
